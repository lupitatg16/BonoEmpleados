<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>&#66;&#111;&#110;&#111;</title>
    <style>
        body {
            background: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #024b69;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: white;
            font-size: 1.5em;
            margin: 0 0 20px 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: white;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #e8f0fe;
        }
        #resultado {
            background: #90EE90;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body><script>document.write(`
<div class="container">
    <h1>Cálculo del tipo de bono anual a empleados</h1>
    <div id="mensajeError"></div>
    <div class="form-group">
        <label>Núm. empleado:</label>
        <input type="text">
    </div>
    <div class="form-group">
        <label>Nombre del empleado:</label>
        <input type="text">
    </div>
    <div class="form-group">
        <label>Antigüedad en Meses:</label>
        <input type="number">
    </div>
    <div class="form-group">
        <label>Nivel:</label>
        <input type="text">
    </div>
    <div class="form-group">
        <label>Tipo de Bono a asingar:</label>
        <div id="resultado"></div>
    </div>
    <button onclick="calcularBono()">Calcular Bono</button>
</div>
`);</script></body>
</html>
