<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo del tipo de bono anual a empleados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #0c4d6c;
            color: white;
            padding: 30px;
            border-radius: 10px;
            width: 800px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            width: 200px;
            margin-right: 10px;
        }

        input {
            padding: 8px;
            border: none;
            border-radius: 4px;
            background-color: #c1e6c1;
            width: 300px;
        }

        #resultado {
            background-color: #90EE90;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
            min-height: 20px;
            margin-left: auto;
            text-align: center;
            color: black;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #mensajeError {
            color: #ff4444;
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cálculo del tipo de bono anual a empleados</h1>
        <div id="mensajeError"></div>
        <div class="form-group">
            <label for="numEmpleado">Núm. empleado:</label>
            <input type="text" id="numEmpleado" maxlength="3">
        </div>
        <div class="form-group">
            <label for="nombreEmpleado">Nombre del empleado:</label>
            <input type="text" id="nombreEmpleado" maxlength="20">
        </div>
        <div class="form-group">
            <label for="antiguedad">Antigüedad en Meses:</label>
            <input type="text" id="antiguedad" maxlength="6"> <!-- DEFECTO: Debería ser maxlength="3" -->
        </div>
        <div class="form-group">
            <label for="nivel">Nivel:</label>
            <input type="text" id="nivel" maxlength="1">
        </div>
        <div class="form-group">
            <label>Tipo de Bono a asignar:</label>
            <div id="resultado"></div>
        </div>
        <button onclick="calcularBono()">Calcular Bono</button>
    </div>

    <script>
        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('mensajeError');
            errorDiv.textContent = mensaje;
            errorDiv.style.display = 'block';
            document.getElementById('resultado').textContent = '';
        }

        function limpiarError() {
            document.getElementById('mensajeError').style.display = 'none';
        }

        function validarCampos() {
            limpiarError();

            // Validar número de empleado
            const numEmpleado = document.getElementById('numEmpleado').value;
            if (!numEmpleado || numEmpleado === '000' || !/^[0-9]{3}$/.test(numEmpleado)) {
                mostrarError('El campo que tiene error es: Núm. empleado. Debe ser un número de 3 dígitos (excluye 000)');
                return false;
            }

            // Validar nombre del empleado
            const nombreEmpleado = document.getElementById('nombreEmpleado').value;
            if (!nombreEmpleado || nombreEmpleado.length < 5 || nombreEmpleado.length > 20 || !/^[a-zA-Z0-9]+$/.test(nombreEmpleado)) {
                mostrarError('El campo que tiene error es: Nombre del empleado. Debe ser alfanumérico entre 5 y 20 caracteres');
                return false;
            }

            // Validar antigüedad (DEFECTO: No valida el máximo de 3 dígitos)
            const antiguedad = document.getElementById('antiguedad').value;
            if (!antiguedad || !/^\d+$/.test(antiguedad)) {
                mostrarError('El campo que tiene error es: Antigüedad en Meses. Debe ser un número positivo');
                return false;
            }

            // Validar nivel
            const nivel = document.getElementById('nivel').value;
            if (nivel !== '*' && nivel !== '-') {
                mostrarError('El campo que tiene error es: Nivel. Debe ser "*" para indicar que el empleado es directivo o "-" para indicar que no lo es');
                return false;
            }

            return true;
        }

        function calcularBono() {
            if (!validarCampos()) {
                return;
            }

            const antiguedad = parseInt(document.getElementById('antiguedad').value);
            const nivel = document.getElementById('nivel').value;
            let tipoBono = '';

            if (nivel === '*') { // Directivo
                if (antiguedad >= 12) {
                    tipoBono = 'Tipo B4'; // DEFECTO: Debería ser 'Tipo B1'
                } else {
                    tipoBono = 'Tipo B3';
                }
            } else { // nivel === '-', No directivo
                if (antiguedad >= 12) {
                    tipoBono = 'Tipo B2';
                } else {
                    tipoBono = 'Tipo B4';
                }
            }

            document.getElementById('resultado').textContent = tipoBono;
        }
    </script>
</body>
</html>
